<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUD-012 Text Size Contrast Harness</title>
    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070a;
      }
    </style>
    <script>
      (() => {
        window.__hud012TextSizeContrastEvidence = {
          ready_for_capture: false,
          fixture: "hud_012_text_size_contrast",
          reported: null,
        };

        window.hudTextSizeContrastReady = (json) => {
          const report = JSON.parse(json);
          window.__hud012TextSizeContrastEvidence = {
            ...window.__hud012TextSizeContrastEvidence,
            ...report,
            reported: report,
          };
          document.title = "HUD-012 Text Size Contrast Harness READY";
        };
      })();
    </script>
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="hud_text_size_contrast_harness"
      data-wasm-opt="0"
    />
  </head>
  <body>
    <canvas id="bevy"></canvas>
  </body>
</html>
