<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAU-011 Auction Bid Target Focus Harness</title>
    <style>
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070a;
      }
    </style>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const scenario = params.get("scenario") || "affordable";

        window.__sau011AuctionEvidence = {
          ready_for_capture: false,
          fixture: "sau_011_auction_bid_target_focus",
          scenario,
          reported: null,
        };

        window.sau011AuctionEvidenceReady = (json) => {
          const report = JSON.parse(json);
          window.__sau011AuctionEvidence = {
            ...window.__sau011AuctionEvidence,
            ...report,
            reported: report,
          };
          document.title = `SAU-011 ${report.scenario} READY`;
        };
      })();
    </script>
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="shop_auction_bid_target_focus_harness"
      data-wasm-opt="0"
    />
  </head>
  <body>
    <canvas id="bevy"></canvas>
  </body>
</html>
