[package]
name = "client"
version = "0.1.0"
edition = "2021"
description = "WASM Bevy client. Read-only view of server state. No game logic."

[dependencies]
shared = { path = "../shared" }
# ADR-003: Bevy 0.18 introduces high-level feature collections ("2d", "ui", "3d").
# The individual crate-level features below MAY still be valid in 0.18, but
# the preferred approach is to use the collection:
#   bevy = { version = "0.18", default-features = false, features = ["2d"] }
# This compiles bevy_ui, bevy_sprite, bevy_text, bevy_asset, and all 2D APIs.
# TODO(liv-bevy-018): verify whether individual feature names ("bevy_ui",
# "bevy_sprite", "bevy_text", "bevy_asset") are still valid in 0.18 or if
# the "2d" collection must be used. See VERSION.md for the migration guide URL.
# TODO(liv-bevy-018): verify "webgl2" feature name in Bevy 0.18.
bevy = { version = "0.18", features = [
    "bevy_ui",    # TODO(liv-bevy-018): verify — may be included in "2d" collection
    "bevy_sprite", # TODO(liv-bevy-018): verify — may be included in "2d" collection
    "bevy_text",  # TODO(liv-bevy-018): verify — may be included in "2d" collection
    "bevy_asset", # TODO(liv-bevy-018): verify — may be included in "2d" collection
    "webgl2",     # TODO(liv-bevy-018): verify feature name in Bevy 0.18
    # "mouse",     # verify feature name in Bevy 0.18
    # "keyboard",  # verify feature name in Bevy 0.18
] }
lightyear = { version = "0.26", default-features = false, features = ["client", "websocket"] }
# bevy_tweening: no 0.18 release on crates.io yet — re-add when available
# bevy_asset_loader = "0.22"  # TODO: verify 0.18-compatible version on crates.io

[[bin]]
name = "client"
path = "src/main.rs"
