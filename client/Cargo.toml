[package]
name = "client"
version = "0.1.0"
edition = "2021"
description = "WASM Bevy client. Read-only view of server state. No game logic."

[dependencies]
shared = { path = "../shared" }
serde = { workspace = true }
serde_json = { workspace = true }
# Bevy 0.18 high-level feature collection for 2D games (liv-bevy-018).
# "2d" includes bevy_sprite, bevy_text, bevy_asset, bevy_ui, and bevy_render.
# "webgl2" enables the WebGL2 backend for WASM targets.
bevy = { version = "0.18", default-features = false, features = ["2d", "webgl2", "bevy_audio"] }
# "server" must be present alongside "client" so that Lightyear registers the
# same internal server-side components in BOTH binaries. Without it the internal
# component ID table differs between client and server, causing a ComponentId
# shift that manifests as MissingComponent decode errors (e.g. ComponentId(320)).
lightyear = { version = "0.26", default-features = false, features = ["client", "server", "websocket", "raw_connection", "replication"] }
bevy_tweening = { workspace = true, default-features = false, features = ["bevy_sprite", "bevy_ui", "bevy_text"] }
# bevy_asset_loader = "0.22"  # TODO: verify 0.18-compatible version on crates.io

# Tracing infrastructure (S11-TD-CLIENT-LOG-001 / PROMPT 647). Required because
# client's bevy is built with `default-features = false` and no `bevy_log`
# feature, so DefaultPlugins does NOT include LogPlugin and no tracing
# dispatcher is installed by default. Without this, every `tracing::*` call
# from app code is a silent no-op and client stdout is dark during native runs.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

[features]
# PROMPT 1150 (S17-UI-CLICK-PICKING-BACKEND-001) — `ui_picking` ships in the
# default feature set so the Bevy UI picking backend is loaded by
# `DefaultPlugins` in `client/src/main.rs`. Without that backend the
# `bevy_ui` `Button` + `Interaction` state machine never transitions to
# `Interaction::Pressed`, which silently kills every Shop / Auction click
# handler (shop slot purchase, refresh, ready, bid increment, pass) and
# every `Pointer<Press>` observer on the hand fan / placement drag pipeline.
# ADR-021's "no-`ui_picking` CI build gate" still holds for the cfg-gated
# `Pickable` insert sites — exercise it via
# `cargo build -p client --no-default-features`.
default = ["ui_picking"]
ui_picking = ["bevy/ui_picking", "bevy/bevy_picking"]
# S17-OPS-VULKAN-VALIDATION-GATING-001 (AUDIT-1076-18): opt-in WGPU validation
# layer flags. OFF by default so a stock `cargo build -p client` / `trunk build`
# does not request `VK_LAYER_KHRONOS_validation` (the layer is not installed on
# the test / dev / end-user Windows machine, producing three warning lines on
# every launch). Build with `cargo build -p client --features wgpu-validation`
# when debugging GPU issues to restore wgpu's `from_build_config()` defaults.
wgpu-validation = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

