[package]
name = "dev-launcher-app"
version = "0.1.0"
edition = "2021"
description = "Windows two-button developer launcher EXE wrapping tools/dev-launcher PowerShell scripts."
publish = false
build = "build.rs"

[[bin]]
name = "ccgs-dev-launcher"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
native-windows-gui = "1"
native-windows-derive = "1"

# Embeds res/ccgs-dev-launcher.ico as the EXE's Win32 ICON resource so
# Explorer, the taskbar, and Alt-Tab pick it up. Windows-only; the build
# script is a no-op on any other target.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
