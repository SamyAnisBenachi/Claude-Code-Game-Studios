[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcs-orchestrator"
version = "0.1.0"
description = "GCS Codex orchestrator stack — app-server transport, viewer, relay, dispatcher integration."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sam"}]
dependencies = [
    "websocket-client>=1.6",
    "pydantic>=2.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tui = [
    "textual>=0.47",
    "rich>=13.7",
    "pyperclip>=1.8",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.scripts]
gcs-viewer = "gcs_orchestrator.viewer:main"
gcs-relay = "gcs_orchestrator.relay:main"
gcs-dispatch = "gcs_orchestrator.dispatch:main"
gcs-config = "gcs_orchestrator.config:cli"
gcs-relay-history = "gcs_orchestrator.history:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
