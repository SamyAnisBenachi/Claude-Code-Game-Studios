[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Headless Bevy game server. All authoritative game state lives here."

[dependencies]
shared = { path = "../shared" }
# TODO(liv-bevy-018): verify Bevy 0.18 headless server features.
# "multi_threaded" enables the async task executor (likely correct for server).
# Bevy 0.18 also introduces high-level feature collections ("2d", "3d", "ui") —
# for a headless server, no rendering features are needed. If "multi_threaded"
# alone is insufficient (e.g., missing scheduling), add "bevy_app", "bevy_ecs".
# Do NOT add "bevy_ecs" as a feature — it is a crate name, not a feature flag.
bevy = { version = "0.18", default-features = false, features = ["multi_threaded", "bevy_log", "bevy_asset", "bevy_state"] }
# "client" required: lightyear_transport 0.26.4 has a shared bidirectional transport
# layer that requires both "client" and "server" features to compile, even in a
# server-only binary. "raw_connection" maps WebSocket links to Connected entities
# without netcode, which is the verified localhost WebSocket path for S3-06.
lightyear = { version = "0.26", default-features = false, features = ["client", "server", "websocket", "raw_connection"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# ADR-004: ron is a direct dep — not re-exported from bevy_asset as of Bevy 0.18

[[bin]]
name = "server"
path = "src/main.rs"

[[test]]
name = "e2e_websocket_test"
path = "../tests/integration/network/e2e_websocket_test.rs"

[[test]]
name = "auction_state_scaffold_test"
path = "../tests/unit/auction/auction_state_scaffold_test.rs"

[[test]]
name = "keyword_plugin_smoke_test"
path = "../tests/integration/keyword/plugin_smoke_test.rs"
