# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: auction_economy_reservation
    status: active
    api: "Direct ResMut<EconomyState> access within auction_tick_system"
    not: "Cross-frame Bevy Messages (ReserveGold, ReleaseGoldReservation as separate messages)"
    adr: docs/architecture/adr-013-auction-system-state.md
    reason: "release_gold_reservation(prev_leader) and reserve_gold(new_leader) must be atomic within one system run — cross-frame messages would allow a one-frame intermediate state where two players simultaneously have non-zero reserved_gold, violating GDD Rule 5 invariant"
    referenced_by:
      - docs/architecture/adr-013-auction-system-state.md
    added: "2026-04-30"
    revised: ""

  - purpose: hand_write_api
    status: active
    api: "hand_push(&mut HandState, player: PlayerId, card_id: CardId) -> Result<(), HandFullError> — pure module function in server/feature/hand/mod.rs"
    not: "Direct ResMut<HandState> struct field mutation inline; Message-based hand write (AddCardToHand message + separate writer system)"
    adr: docs/architecture/adr-016-prism-system-architecture.md
    reason: "Shared function prevents dual-ownership while keeping HandState write path consistent. Bevy system scheduler enforces that no two callers hold ResMut<HandState> concurrently — card-acquisition runs in DRAFT, prism runs in RESOLUTION, phases are mutually exclusive."
    referenced_by:
      - docs/architecture/adr-016-prism-system-architecture.md
    added: "2026-04-30"
    revised: ""

  - purpose: bevy_vs_lightyear_message_api
    status: active
    api: "MessageWriter<T> / MessageReader<T> for Bevy-internal server phase messages (BeginResolution, ResolutionComplete, AuctionPhaseEntered, etc.); MessageSender<T> / MessageReceiver<T> for Lightyear network protocol messages (S2CResolutionEvent, C2SSubmitPlacement, etc.)"
    not: "Using MessageWriter for Lightyear protocol messages, or MessageSender for Bevy-internal phase messages — these are different crates with different APIs that do not compose"
    adr: docs/architecture/adr-017-combat-resolution-execution-architecture.md
    reason: "Bevy 0.16 split Event into Message (buffered, same-process) while Lightyear 0.26 uses its own MessageSender/MessageReceiver over the network transport layer. Conflating the two causes compile errors or silent message loss with no type-system guard."
    referenced_by:
      - docs/architecture/adr-017-combat-resolution-execution-architecture.md
      - docs/architecture/adr-010-rsm-event-bus.md
      - docs/architecture/adr-014-class-system-architecture.md   # C2SClassChoice uses Lightyear Message; LobbyComplete uses Bevy Message
    added: "2026-04-30"
    revised: ""

  - purpose: class_effect_dispatch
    status: active
    api: "Plain Rust functions (fn apply_gelure(sessions: &mut PlayerSessions, player_id: PlayerId)) called from within the RESOLUTION system body (fn resolve_combat(world: &mut World))"
    not: "Standalone Bevy systems registered for class effects; buffered MessageWriter<ClassEffect*> within a RESOLUTION tick"
    adr: docs/architecture/adr-014-class-system-architecture.md
    reason: "PlayerId is plain data — not a Bevy SystemParam. Buffered messages are frame-delayed and would decouple RESOLUTION sub-steps (e.g., Xelorium sub-step 1 and Rollback sub-step 2 must execute in the same frame). Plain function calls within resolve_combat preserve sub-step ordering with no frame-delay risk."
    referenced_by:
      - docs/architecture/adr-014-class-system-architecture.md
    added: "2026-04-30"
    revised: ""

  - purpose: keyword_state_storage
    status: active
    api: "Monolithic UnitKeywordState component on each board unit entity — all 6 persistent states (shield_active, stun_active, silenced_until_round, leader_bonus_atk, leader_bonus_hp, bodyguard_protects, outnumbered_active) co-located in one struct"
    not: "Individual components per keyword state (ShieldActive, StunState, SilencedState, LeaderBonus, BodyguardBond as separate optional components)"
    adr: docs/architecture/adr-018-keyword-system.md
    reason: "Up to 10 units × 6 states × 12 sub-step boundaries = up to 720 archetype migrations per RESOLUTION round with individual components. Monolithic struct has O(1) component access with no structural changes. Direct 1:1 mapping to UnitBoardState network fields simplifies snapshot serialization."
    referenced_by:
      - docs/architecture/adr-018-keyword-system.md
    added: "2026-04-30"
    revised: ""

  - purpose: bodyguard_bond_storage
    status: active
    api: "Option<Entity> field (bodyguard_protects) in UnitKeywordState on the BODYGUARD entity — typed Bevy Entity handle, stable across CHANGE LANE"
    not: "Lane-scoped or cell-scoped attribute on any board/lane resource; separate BodyguardBond component; EntityId (protocol-crate u32) in server-side ECS storage"
    adr: docs/architecture/adr-018-keyword-system.md
    reason: "GDD explicitly forbids lane-scoped storage — bond must survive CHANGE LANE. Bevy Entity handles are stable within one ECS World session across position changes. Separate component adds dual-write complexity for marginal query ergonomics. protocol/ EntityId must never appear in server-side ECS types."
    referenced_by:
      - docs/architecture/adr-018-keyword-system.md
    added: "2026-04-30"
    revised: ""

  - purpose: serde_keyword_enum
    status: active
    api: "#[serde(tag = \"kw\", content = \"val\")] adjacent tagging on the Keyword enum in shared/src/card.rs"
    not: "#[serde(tag = \"kw\")] internal tagging (fails at runtime for Simple(SimpleKeyword) newtype when inner type serializes as a scalar); #[serde(untagged)] (ambiguous when multiple struct variants present)"
    adr: docs/architecture/adr-018-keyword-system.md
    reason: "Internal tagging requires all variant inner types to serialize as maps. SimpleKeyword unit variants serialize as plain strings — the internal tagger panics at runtime trying to merge the tag field into a non-map. Adjacent tagging handles unit, newtype, and struct variants uniformly."
    referenced_by:
      - docs/architecture/adr-018-keyword-system.md
    added: "2026-04-30"
    revised: ""

  - purpose: economy_write_api
    status: active
    api: "Pure Rust functions in server/src/core/economy/api.rs taking (&mut PlayerEconomy, ...) — apply_gold_award, spend_gold, apply_mana_ramp, add_reserve, reserve_gold, release_gold_reservation, discard_current_mana, increment_mana_cap, validate_spend, apply_spend"
    not: "Direct field assignment to PlayerEconomy fields outside api.rs; buffered Messages for economy mutations (e.g., AwardGold { player, amount } as a cross-system message); separate per-currency resources (GoldState, ManaState) that split the auto-split mana invariant"
    adr: docs/architecture/adr-019-economy-resource-architecture.md
    reason: "All PlayerEconomy field mutations centralized in api.rs for auditability and grep-gateability. Auto-split mana spend (current first, reserve overflow) and auction reservation invariant (reserved_gold <= gold) both require inspecting multiple fields atomically — only possible when fields co-locate in one struct with a single write path."
    referenced_by:
      - docs/architecture/adr-019-economy-resource-architecture.md
      - docs/architecture/adr-013-auction-system-state.md   # auction uses reserve_gold / release_gold_reservation via api.rs
    added: "2026-04-30"
    revised: ""

  - purpose: economy_interest_snapshot_trigger
    status: active
    api: "MessageReader<ResolutionComplete> in on_resolution_complete (EconomySystemSet::ResolutionEnd) — captures gold snapshot AFTER resolve_combat has awarded all kill/objective gold"
    not: "MessageReader<ResolutionPhaseEntered> for the snapshot — fires at RESOLUTION start, before kill/objective rewards, producing incorrect (understated) interest income"
    adr: docs/architecture/adr-019-economy-resource-architecture.md
    reason: "GDD economy-system.md Rule 6 specifies snapshot at end of RESOLUTION 'after all kill/objective rewards have fired'. ResolutionPhaseEntered fires at start; ResolutionComplete fires after resolve_combat's six sub-steps complete. The snapshot must read ResolutionComplete."
    referenced_by:
      - docs/architecture/adr-019-economy-resource-architecture.md
    added: "2026-04-30"
    revised: ""

