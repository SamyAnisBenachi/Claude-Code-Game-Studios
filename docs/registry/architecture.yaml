# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: multiple_c2s_auction_bid_readers
    status: active
    description: "Only auction_tick_system may drain Lightyear's MessageReceiver<C2SAuctionBid>. No standalone phase-gate handler or secondary system may also read this receiver in the same frame."
    why: "Lightyear's MessageReceiver<T> can only be drained once per frame — the first system to read it consumes all messages. A second reader would silently starve the first of messages, causing bids to be lost without error."
    adr: docs/architecture/adr-013-auction-system-state.md
    added: "2026-04-30"

  - pattern: resMut_auction_state_outside_tick_system
    status: active
    description: "ResMut<AuctionState> may only appear in auction_tick_system. All other systems must use Res<AuctionState> (read-only)."
    why: "AuctionState is the single source of truth for auction phase. Multiple writers would create split-brain state and violate the Rule 5 reservation invariant, which relies on sequential execution within one system body."
    adr: docs/architecture/adr-013-auction-system-state.md
    added: "2026-04-30"

  - pattern: multiple_c2s_shop_message_readers
    status: active
    description: "Only card_acquisition_tick_system may drain MessageReceiver<C2SPurchaseCard> and MessageReceiver<C2SRefreshShop>. No other system may read these receivers."
    why: "Lightyear's MessageReceiver<T> can only be drained once per frame — the first system to read it consumes all messages. A second reader would silently starve the first, causing purchases or refresh requests to be lost without error."
    adr: docs/architecture/adr-015-card-acquisition-shop-state.md
    added: "2026-04-30"

  - pattern: resMut_shop_states_outside_tick_system
    status: active
    description: "ResMut<ShopStates> may only appear in card_acquisition_tick_system. All other systems must use Res<ShopStates> (read-only)."
    why: "ShopStates is the single source of truth for per-player shop state. Multiple writers would allow external systems to corrupt displayed_this_draft or current_slots, breaking the dedup invariant and the CA18 rollback guarantee."
    adr: docs/architecture/adr-015-card-acquisition-shop-state.md
    added: "2026-04-30"

  - pattern: multiple_prism_collected_readers
    status: active
    description: "Only resolve_prism_draws may drain MessageReader<PrismCollected>. No other system may register a MessageReader<PrismCollected>. PrismCollected is a server-internal Bevy Message (not a Lightyear C2S message) — MessageReader<T> and Lightyear's MessageReceiver<T> are distinct APIs and must not be conflated."
    why: "Bevy's MessageReader<T> drains the buffer on read — a second reader in the same Update frame would starve the first. Since resolve_prism_draws is the sole consumer of prism collection events, registering a second reader would silently cause it to see zero events, breaking prism reward delivery with no compile-time error."
    adr: docs/architecture/adr-016-prism-system-architecture.md
    added: "2026-04-30"

  - pattern: multi_frame_resolution_substeps
    status: active
    description: "The 6-step Combat Resolution algorithm must NOT be split across Bevy frames via a ResolutionSubStep state machine. All 6 sub-steps must execute inside a single fn resolve_combat(world: &mut World) exclusive system call."
    why: "Cross-frame execution allows other Bevy systems to observe intermediate board state between sub-steps (e.g., dead units still present after sub-step 3 damage but before sub-step 4 removal). It also complicates the RSM's 60-second safety timeout, which monitors a single ResolutionComplete message — not per-sub-step heartbeats."
    adr: docs/architecture/adr-017-combat-resolution-execution-architecture.md
    added: "2026-04-30"

  - pattern: per_substep_resolution_streaming
    status: active
    description: "S2CResolutionEvent must NOT be sent as a stream of per-sub-step partial messages. A single batch message is sent after all 6 sub-steps complete."
    why: "The server completes all 6 sub-steps in ≤ 15 ms (one Bevy frame). Streaming messages would arrive in the same Lightyear batch — no latency benefit — while requiring clients to apply partial board mutations mid-resolution, complicating ClientState and the reconnect snapshot path."
    adr: docs/architecture/adr-017-combat-resolution-execution-architecture.md
    added: "2026-04-30"

  - pattern: multiple_c2s_class_choice_readers
    status: active
    description: "Only the LOBBY handler system may drain Lightyear's MessageReceiver<C2SClassChoice>. No secondary system or phase-gate handler may also read this receiver."
    why: "Lightyear's MessageReceiver<T> can only be drained once per frame — the first system to read it consumes all messages. A second reader would silently starve the LOBBY handler, causing class selections to be lost without error."
    adr: docs/architecture/adr-014-class-system-architecture.md
    added: "2026-04-30"

  - pattern: class_effect_as_standalone_bevy_system
    status: active
    description: "Class-specific card effects (Gelure, Xelorium, Rollback, Sang Méprise, Punition, Seed walk-over, Dé du Chateux, etc.) must NOT be registered as standalone Bevy systems or use buffered MessageWriter<T> within a RESOLUTION tick."
    why: "PlayerId is plain data, not a Bevy SystemParam — standalone systems cannot receive per-player context as function arguments. Buffered messages are frame-delayed and would decouple RESOLUTION sub-steps that must execute in the same frame (Xelorium at sub-step 1, Rollback at sub-step 2). All class effects are plain Rust helper functions called from within resolve_combat."
    adr: docs/architecture/adr-014-class-system-architecture.md
    added: "2026-04-30"

  - pattern: keyword_state_as_lane_attribute
    status: active
    description: "BODYGUARD bond and all keyword state must NOT be stored as lane-scoped or cell-scoped attributes on any board/lane resource. Keyword state belongs on the unit entity's UnitKeywordState component."
    why: "Lane-scoped storage silently orphans the BODYGUARD bond when the protected unit executes CHANGE LANE — the entity reference is lost. GDD explicitly forbids this: 'BODYGUARD protection MUST be stored as a unit-to-unit entity bond, NOT as a lane-scoped attribute.' Entity references in UnitKeywordState are stable across position changes."
    adr: docs/architecture/adr-018-keyword-system.md
    added: "2026-04-30"

  - pattern: direct_player_economy_field_write
    status: active
    description: "Code outside server/src/core/economy/api.rs must NOT assign directly to PlayerEconomy fields (economy.gold = x, economy.current_mana = x, economy.reserve_mana = x, economy.mana_cap = x, economy.reserved_gold = x). All mutations must go through api.rs functions."
    why: "Direct field mutation bypasses validation (auto-split invariant, reserved_gold <= gold invariant, mana_cap ceiling) and breaks the single auditable write path. A CI grep for '.gold =', '.current_mana =', etc. outside api.rs is the enforcement mechanism."
    adr: docs/architecture/adr-019-economy-resource-architecture.md
    added: "2026-04-30"

  - pattern: economy_snapshot_at_resolution_start
    status: active
    description: "The economy interest snapshot must NOT be captured at ResolutionPhaseEntered. Any system reading MessageReader<ResolutionPhaseEntered> to snapshot gold is wrong — the snapshot must read MessageReader<ResolutionComplete>."
    why: "ResolutionPhaseEntered fires before resolve_combat runs; kill/objective gold awards happen inside resolve_combat's six sub-steps. A snapshot at ResolutionPhaseEntered misses all in-round gold awards, understating next-round interest. GDD Rule 6: snapshot is taken 'after all kill/objective rewards have fired'."
    adr: docs/architecture/adr-019-economy-resource-architecture.md
    added: "2026-04-30"

