#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: auction_phase_trigger
    status: active
    pattern: event_bus
    producer: rsm-system
    consumers:
      - auction-system   # reads AuctionPhaseEntered to start auction
    adr: docs/architecture/adr-013-auction-system-state.md
    signal_signature: "AuctionPhaseEntered { round: u32 } — Bevy buffered Message, #[derive(Message)]"
    referenced_by:
      - docs/architecture/adr-013-auction-system-state.md
      - docs/architecture/adr-010-rsm-event-bus.md
    added: "2026-04-30"
    revised: ""

  - contract: auction_settlement
    status: active
    pattern: event_bus
    producer: auction-system
    consumers:
      - rsm-system   # reads AuctionSettled to transition DRAFT_AUCTION → DRAFT_SHOP
    adr: docs/architecture/adr-013-auction-system-state.md
    signal_signature: "AuctionSettled { winner: Option<PlayerId>, final_price: u32, card_id: CardId } — Bevy buffered Message, #[derive(Message)]"
    referenced_by:
      - docs/architecture/adr-013-auction-system-state.md
      - docs/architecture/adr-010-rsm-event-bus.md
      - docs/architecture/adr-009-rsm-phase-state.md
    added: "2026-04-30"
    revised: ""

  - contract: shop_refresh_trigger
    status: active
    pattern: event_bus
    producer: rsm-system
    consumers:
      - card-acquisition-system   # reads ShopRefreshTriggered to execute auto-refresh draws
    adr: docs/architecture/adr-015-card-acquisition-shop-state.md
    signal_signature: "ShopRefreshTriggered { player_id: PlayerId, trigger: ShopRefreshTrigger } — Bevy buffered Message, #[derive(Message)]. Trigger variants: DraftInitial | AuctionLock | ShopOpen | ShopUnlock"
    referenced_by:
      - docs/architecture/adr-015-card-acquisition-shop-state.md
      - docs/architecture/adr-010-rsm-event-bus.md
    added: "2026-04-30"
    revised: ""

  - contract: prism_collection_trigger
    status: active
    pattern: event_bus
    producer: board-lane-system
    consumers:
      - prism-system   # MessageReader<PrismCollected> in resolve_prism_draws; server-internal Bevy Message only
    adr: docs/architecture/adr-016-prism-system-architecture.md
    signal_signature: "PrismCollected { player: PlayerId, lane: u8 } — Bevy buffered Message (#[derive(Message)]), server-internal. NOT a Lightyear C2S message. Emitted during RESOLUTION sub-step 5 by Board/Lane System when a unit ends standard movement at its own spawn cell with prism present."
    referenced_by:
      - docs/architecture/adr-016-prism-system-architecture.md
    added: "2026-04-30"
    revised: ""

