# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-04-30"  # updated by ADR-014, ADR-015, ADR-016

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: auction_state
    status: active
    owner_system: auction-system
    adr: docs/architecture/adr-013-auction-system-state.md
    interface: "Res<AuctionState> (read-only from all other systems); auction_snapshot(&AuctionState) -> Option<AuctionSnapshot> for reconnect handler; ResMut<AuctionState> in auction_tick_system ONLY"
    write_access: auction_tick_system-only
    referenced_by:
      - docs/architecture/adr-013-auction-system-state.md
      - docs/architecture/adr-009-rsm-phase-state.md   # rsm_tick_system reads AuctionSettled, not AuctionState directly
    added: "2026-04-30"
    revised: ""

  - state: shop_state_per_player
    status: active
    owner_system: card-acquisition-system
    adr: docs/architecture/adr-015-card-acquisition-shop-state.md
    interface: "Res<ShopStates> (read-only from all other systems); ResMut<ShopStates> in card_acquisition_tick_system ONLY — PlayerShopState fields: phase, displayed_this_draft, current_slots, refresh_count_this_draft"
    write_access: card_acquisition_tick_system-only
    referenced_by:
      - docs/architecture/adr-015-card-acquisition-shop-state.md
    added: "2026-04-30"
    revised: ""

  - state: player_hands
    status: active
    owner_system: card-acquisition-system
    adr: docs/architecture/adr-015-card-acquisition-shop-state.md
    interface: "ResMut<PlayerHands> — multiple authorized writers (card_acquisition_tick_system in DRAFT phases; prism_tick_system and objective_tick_system in RESOLUTION phase). Phases are mutually exclusive — no concurrent write conflict. Read via Res<PlayerHands> by any system."
    write_access: card_acquisition_tick_system (DRAFT) + prism_tick_system (RESOLUTION) + objective_tick_system (RESOLUTION)
    referenced_by:
      - docs/architecture/adr-015-card-acquisition-shop-state.md
      - docs/architecture/adr-016-prism-system-architecture.md   # hand_push() shared fn writes PlayerHands from RESOLUTION
    added: "2026-04-30"
    revised: ""

  - state: prism_state
    status: active
    owner_system: prism-system
    adr: docs/architecture/adr-016-prism-system-architecture.md
    interface: "Res<PrismState> NOT exposed to external systems — external systems read PrismPresence component (Lightyear-replicated) instead. ResMut<PrismState> exclusive to resolve_prism_draws."
    write_access: resolve_prism_draws-only
    referenced_by:
      - docs/architecture/adr-016-prism-system-architecture.md
    added: "2026-04-30"
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | superseded_by: ADR-NNNN
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
