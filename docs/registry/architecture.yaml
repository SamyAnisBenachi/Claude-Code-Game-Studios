# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-04-30"  # updated by ADR-014, ADR-015, ADR-016, ADR-019, ADR-020

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: auction_state
    status: active
    owner_system: auction-system
    adr: docs/architecture/adr-013-auction-system-state.md
    interface: "Res<AuctionState> (read-only from all other systems); auction_snapshot(&AuctionState) -> Option<AuctionSnapshot> for reconnect handler; ResMut<AuctionState> in auction_tick_system ONLY"
    write_access: auction_tick_system-only
    referenced_by:
      - docs/architecture/adr-013-auction-system-state.md
      - docs/architecture/adr-009-rsm-phase-state.md   # rsm_tick_system reads AuctionSettled, not AuctionState directly
    added: "2026-04-30"
    revised: ""

  - state: shop_state_per_player
    status: active
    owner_system: card-acquisition-system
    adr: docs/architecture/adr-015-card-acquisition-shop-state.md
    interface: "Res<ShopStates> (read-only from all other systems); ResMut<ShopStates> in card_acquisition_tick_system ONLY — PlayerShopState fields: phase, displayed_this_draft, current_slots, refresh_count_this_draft"
    write_access: card_acquisition_tick_system-only
    referenced_by:
      - docs/architecture/adr-015-card-acquisition-shop-state.md
    added: "2026-04-30"
    revised: ""

  - state: player_hands
    status: active
    owner_system: card-acquisition-system
    adr: docs/architecture/adr-015-card-acquisition-shop-state.md
    interface: "ResMut<PlayerHands> — multiple authorized writers (card_acquisition_tick_system in DRAFT phases; prism_tick_system and objective_tick_system in RESOLUTION phase). Phases are mutually exclusive — no concurrent write conflict. Read via Res<PlayerHands> by any system."
    write_access: card_acquisition_tick_system (DRAFT) + prism_tick_system (RESOLUTION) + objective_tick_system (RESOLUTION)
    referenced_by:
      - docs/architecture/adr-015-card-acquisition-shop-state.md
      - docs/architecture/adr-016-prism-system-architecture.md   # hand_push() shared fn writes PlayerHands from RESOLUTION
    added: "2026-04-30"
    revised: ""

  - state: prism_state
    status: active
    owner_system: prism-system
    adr: docs/architecture/adr-016-prism-system-architecture.md
    interface: "Res<PrismState> NOT exposed to external systems — external systems read PrismPresence component (Lightyear-replicated) instead. ResMut<PrismState> exclusive to resolve_prism_draws."
    write_access: resolve_prism_draws-only
    referenced_by:
      - docs/architecture/adr-016-prism-system-architecture.md
    added: "2026-04-30"
    revised: ""

  - state: player_class
    status: active
    owner_system: session-system
    adr: docs/architecture/adr-014-class-system-architecture.md
    interface: "Res<PlayerSessions>.class_of(player_id: PlayerId) -> ClassId (read-only for all systems); ResMut<PlayerSessions> in LOBBY handler (C2SClassChoice) and RSM gate (lock_all_classes) ONLY. Class is immutable after lock_all_classes() fires at LOBBY->DRAFT_INITIAL."
    write_access: lobby_handler (class selection) + rsm_gate (lock_all_classes) — never again after DRAFT_INITIAL
    referenced_by:
      - docs/architecture/adr-014-class-system-architecture.md
    added: "2026-04-30"
    revised: ""

  - state: unit_keyword_state
    status: active
    owner_system: keyword-system
    adr: docs/architecture/adr-018-keyword-system.md
    interface: "UnitKeywordState component (read-only via Query<&UnitKeywordState> from all other systems; write via Query<&mut UnitKeywordState> in keyword module state_eval systems and keyword::effects::* functions called from within resolve_combat ONLY)"
    write_access: keyword::state_eval systems (leader_snapshot_system, eval_outnumbered_system, bodyguard_cleanup_system) + keyword::effects::* called from resolve_combat exclusive system
    referenced_by:
      - docs/architecture/adr-018-keyword-system.md
    added: "2026-04-30"
    revised: ""

  - state: player_economies
    status: active
    owner_system: economy-system
    adr: docs/architecture/adr-019-economy-resource-architecture.md
    interface: "Res<PlayerEconomies> (read-only for all other systems); ResMut<PlayerEconomies> permitted ONLY in: initialise_player_economies (Observer), on_draft_started (DraftStarted subscriber), on_resolution_complete (ResolutionComplete subscriber), auction_tick_system (reservation atomicity per ADR-013), resolve_combat (exclusive system — kill/objective gold awards via api.rs functions). All field writes go through server/src/core/economy/api.rs — direct field assignment is forbidden outside that module."
    write_access: economy_tick_systems + auction_tick_system (atomic reservation) + resolve_combat (exclusive, gold awards only)
    referenced_by:
      - docs/architecture/adr-019-economy-resource-architecture.md
      - docs/architecture/adr-013-auction-system-state.md   # auction_tick_system holds ResMut<PlayerEconomies>
      - docs/architecture/adr-017-combat-resolution-execution-architecture.md   # resolve_combat awards gold via world.resource_mut()
    added: "2026-04-30"
    revised: ""

  - state: interest_snapshots
    status: active
    owner_system: economy-system
    adr: docs/architecture/adr-019-economy-resource-architecture.md
    interface: "InterestSnapshots is economy-system-internal — not exposed via Res<T> to other systems. Written once per round by on_resolution_complete (reads ResolutionComplete, captures gold per player). Consumed once per round by on_draft_started (removes entry, uses for interest formula). Absent entry → 0 interest (correct for round 1)."
    write_access: on_resolution_complete (writer) + on_draft_started (consumer/remover) — no other system may read or write this resource
    referenced_by:
      - docs/architecture/adr-019-economy-resource-architecture.md
    added: "2026-04-30"
    revised: ""

  - state: board_state
    status: active
    owner_system: board-lane-system
    adr: docs/architecture/adr-020-board-lane-state-architecture.md
    interface: "Res<BoardState> (read-only for placement validation and spatial queries); ResMut<BoardState> permitted ONLY through board/api.rs functions: spawn_unit, move_unit, remove_unit_from_board, change_lane_unit, expand_spawn_range, cleanup_board. Direct HashMap entry mutation outside board/api.rs is forbidden."
    write_access: board/api.rs functions called by (a) board tick systems (PlacementPhaseEntered, OnResolutionEnd subscribers), (b) resolve_combat exclusive system (movement/removal during RESOLUTION sub-steps), (c) Objective System (expand_spawn_range on fake obj destruction)
    referenced_by:
      - docs/architecture/adr-020-board-lane-state-architecture.md
      - docs/architecture/adr-007-placement-buffer.md   # PlacementBuffer commits into board via spawn_unit at sub-step 1
      - docs/architecture/adr-017-combat-resolution-execution-architecture.md   # resolve_combat calls board API functions
      - docs/architecture/adr-018-keyword-system.md   # keyword effects use move_unit / change_lane_unit
    added: "2026-04-30"
    revised: ""

  - state: board_unit_entities
    status: active
    owner_system: board-lane-system
    adr: docs/architecture/adr-020-board-lane-state-architecture.md
    interface: "Bevy ECS entities with Required Components: BoardPosition, UnitOwner, UnitCardRef, UnitType, UnitStats, CurrentHp, UnitKeywordState. Spawned via spawn_unit() in board/api.rs at RESOLUTION sub-step 1 commit. Lightyear ReplicateTo component added ONLY after S2CPlacementReveal is enqueued (per ADR-007 simultaneous-reveal invariant). BoardPosition component mutations ONLY via move_unit() — never direct field assignment."
    write_access: board/api.rs exclusively; resolve_combat reads via world.query() + world.resource_mut::<BoardState>()
    referenced_by:
      - docs/architecture/adr-020-board-lane-state-architecture.md
      - docs/architecture/adr-007-placement-buffer.md
    added: "2026-04-30"
    revised: ""

