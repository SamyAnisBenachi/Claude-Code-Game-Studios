# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: combat-resolution
    status: active
    budget_ms: 15.0
    platform: Server (Railway dyno)
    adr: docs/architecture/adr-017-combat-resolution-execution-architecture.md
    notes: "Single-frame spike during RESOLUTION phase only; clients are non-interactive. Steady-state (between resolutions) < 1 ms. Worst case: contested 5-lane round with 10 units + keywords."
    referenced_by:
      - docs/architecture/adr-017-combat-resolution-execution-architecture.md
    added: "2026-04-30"
    revised: ""

