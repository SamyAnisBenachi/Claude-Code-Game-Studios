name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Bevy on Linux requires these system libraries
  BEVY_ASSET_ROOT: ${{ github.workspace }}

jobs:
  test:
    name: Run Cargo Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Card Animations S2C boundary
        run: |
          set -euo pipefail
          if [ ! -d client/src/card_animations ]; then
            echo "FAIL: client/src/card_animations/ not found; boundary check target missing"
            exit 1
          fi
          if grep -rnE "Message(Reader|Receiver)<S2C" client/src/card_animations/ 2>/dev/null; then
            echo "FAIL: direct S2C subscription in client/src/card_animations/ - see GDD Rule C-14"
            exit 1
          fi
          echo "PASS: Card Animations has no direct S2C subscriptions"

      - name: Check auction source invariants
        run: |
          set -euo pipefail
          deprecated_matches=$(grep -rE "EventWriter|EventReader|Events<|add_event" server/src/feature/auction/ 2>/dev/null || true)
          if [ -n "$deprecated_matches" ]; then
            echo "FAIL: deprecated Bevy event API found in server/src/feature/auction/"
            echo "$deprecated_matches"
            exit 1
          fi

          auction_state_writers=$(grep -rE "ResMut<AuctionState>" server/src/feature/auction/ 2>/dev/null || true)
          writer_count=$(printf "%s\n" "$auction_state_writers" | sed '/^$/d' | wc -l)
          if [ "$writer_count" -ne "1" ]; then
            echo "FAIL: expected exactly one ResMut<AuctionState> in auction source, found $writer_count"
            printf "%s\n" "$auction_state_writers" | sed '/^$/d'
            exit 1
          fi

          if ! printf "%s\n" "$auction_state_writers" | grep -q "server/src/feature/auction/system.rs:"; then
            echo "FAIL: sole ResMut<AuctionState> must be auction_tick_system in system.rs"
            printf "%s\n" "$auction_state_writers" | sed '/^$/d'
            exit 1
          fi

          echo "PASS: auction source invariants hold"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Bevy on Linux requires these for the windowing/audio backends
      # Server tests only need headless deps — client tests need full deps
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Check Board Rendering source guards
        run: |
          set -euo pipefail
          cargo test -p client --test board_rendering_grid_camera_test test_board_z_layers_are_named_constants --verbose
          cargo test -p client --test board_rendering_plugin_scaffold_test board_rendering_does_not_register_phase_receiver --verbose

      # ADR-003: compile shared/ with minimal deps first
      - name: Check shared crate
        run: |
          set -euo pipefail
          cargo check -p shared

      - name: E2E WebSocket round-trip
        run: |
          set -euo pipefail
          cargo test -p server --test e2e_websocket_test e2e_websocket_heartbeat_roundtrip_and_reliable_channel --verbose

      # Run all tests in the workspace
      # Note: client crate tests excluded (WASM target requires trunk, not cargo test)
      - name: Run server tests
        run: |
          set -euo pipefail
          cargo test -p server --verbose

      - name: Run shared tests
        run: |
          set -euo pipefail
          cargo test -p shared --verbose

      # RSM single-writer invariant check (ADR-009)
      # Fails if any system other than advance_phase holds ResMut<RoundState>
      - name: Check RSM single-writer invariant
        run: |
          set -euo pipefail
          # Exclude doc/line comments (grep -r output is "path:content"; :\s*// matches comment lines).
          # || echo 0 handles pipefail: grep -vE exits 1 when all lines are filtered out (no non-comment matches).
          count=$(grep -r "ResMut<RoundState>" server/src/ 2>/dev/null | grep -v "transitions.rs" | grep -vE ":\s*//" | wc -l || echo 0)
          if [ "$count" -gt "0" ]; then
            echo "FAIL: ResMut<RoundState> found outside transitions.rs (in non-comment code)"
            grep -r "ResMut<RoundState>" server/src/ | grep -v "transitions.rs" | grep -vE ":\s*//" || true
            exit 1
          fi
          echo "PASS: ResMut<RoundState> single-writer invariant holds"

      # shared/ purity check (ADR-003)
      # shared/ must not derive Resource, contain plugins, or import bevy_ecs
      - name: Check shared/ purity
        run: |
          set -euo pipefail
          # Exclude comment lines (grep -r output is "path:content"; :\s*// matches comment lines)
          if grep -r "derive(Resource)" shared/src/ 2>/dev/null | grep -vE ":\s*//" | grep -q .; then
            echo "FAIL: #[derive(Resource)] found in shared/ — violates ADR-003"
            grep -r "derive(Resource)" shared/src/ | grep -vE ":\s*//"
            exit 1
          fi
          if grep -r "Plugin" shared/src/ 2>/dev/null | grep -vE ":\s*//" | grep -q .; then
            echo "FAIL: Plugin trait found in shared/ — violates ADR-003"
            grep -r "Plugin" shared/src/ | grep -vE ":\s*//"
            exit 1
          fi
          echo "PASS: shared/ purity checks pass"

  dep-gate-shared:
    name: shared/ dep purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Assert no bevy_ecs/render/ui/winit/tokio in shared/
        run: |
          set -euo pipefail
          TREE=$(cargo tree -p shared --prefix none)
          VIOLATIONS=$(echo "$TREE" | grep -E '^(bevy_ecs|bevy_render|bevy_ui|bevy_winit|tokio) ' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "FAIL: disallowed crates in shared/ dep tree:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "PASS: shared/ dep tree clean"

  dep-gate-client:
    name: client/ dep purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # NOTE: tokio + rand_chacha are both allowed transitively via lightyear 0.26 websocket.
      # Full dep audit deferred to S1-05 (Lightyear 0.26 verification spike).
      # This step is a no-op placeholder until S1-05 establishes the actual dep tree.
      - name: client/ dep tree info (audit deferred to S1-05)
        run: |
          set -euo pipefail
          echo "INFO: client/ dep purity audit deferred to S1-05 Lightyear spike"
          cargo tree -p client --prefix none | grep -E '^(rand_chacha|tokio) ' || echo "PASS: rand_chacha/tokio not found at top level"

  dep-gate-server:
    name: server/ dep purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Assert no bevy_render/ui/winit in server/
        run: |
          set -euo pipefail
          # ADR-003: server/ must not directly declare rendering crates.
          # cargo tree is NOT used here: workspace feature unification from client/'s
          # bevy render features causes render crates to appear in server/'s dep tree
          # even though server/ does not require them. Lightyear transitive render deps
          # will be verified in S1-05 (Lightyear 0.26 spike).
          if grep -qE 'bevy_render|bevy_ui|bevy_winit' server/Cargo.toml; then
            echo "FAIL: forbidden render dep in server/Cargo.toml — violates ADR-003"
            grep -E 'bevy_render|bevy_ui|bevy_winit' server/Cargo.toml
            exit 1
          fi
          echo "PASS: server/Cargo.toml has no forbidden render deps"

  wasm-size:
    name: WASM bundle size check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            pkg-config
      - name: Build WASM client (release, raw cargo — not Trunk bundle)
        run: |
          set -euo pipefail
          cargo build -p client --target wasm32-unknown-unknown --release
      - name: Check raw WASM artifact size (upper-bound proxy; Trunk bundle will be smaller)
        run: |
          set -euo pipefail
          WASM=target/wasm32-unknown-unknown/release/client.wasm
          if [ ! -f "$WASM" ]; then
            echo "FAIL: client.wasm not found at expected path"
            exit 1
          fi
          SIZE=$(stat --format="%s" "$WASM")
          echo "Raw WASM size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          echo "Note: Trunk-processed bundle (50 MB budget) will be smaller than this raw artifact"
          if [ "$SIZE" -gt 104857600 ]; then
            echo "FAIL: raw WASM artifact ($SIZE bytes) exceeds 100 MB upper-bound proxy"
            exit 1
          fi
          echo "PASS: raw artifact within 100 MB proxy budget"

  # WASM client build check (does not run tests — just verifies it compiles)
  # Requires trunk; run locally: trunk build --release
  # TODO: add trunk-based CI once client has meaningful code
