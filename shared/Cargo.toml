[package]
name = "shared"
version = "0.1.0"
edition = "2021"
description = "Protocol types, GameConfig struct, and shared data definitions. Zero Bevy plugin deps."

# ADR-003: shared/ compiles with bevy default-features=false, features=["serialize"] ONLY.
# No Resource derive, no plugins, no game logic.
[dependencies]
# bevy removed — shared/ only defines plain serde types, no Bevy derives needed.
# lightyear removed — shared feature doesn't exist in lightyear 0.26.
# ADR-003 fallback: register_protocol lives in server/main.rs and client/main.rs,
# not here. The `shared` feature does not exist in lightyear 0.26.
serde = { workspace = true }
serde_json = { workspace = true }

# S15-OPS-APPCOMPAT-MANIFEST-001 (PROMPT 1068, mechanism (d)): the Cargo
# `[[test]] name` attribute is renamed from `spawn_range_live_update_contract`
# to `spawn_range_live_refresh_contract` so the emitted test binary filename
# no longer contains the Windows AppCompat installer-detection trigger
# substring `update`. The `path` attribute still pointers the canonical
# source file `spawn_range_live_update_contract_test.rs` (NOT renamed under
# this story; renaming the source file is explicitly out of scope per
# story 006 §"Forbidden"). See
# `docs/setup/dev-environment.md` §"Windows AppCompat heuristic for Cargo
# test binaries" for the heuristic background and the
# `S15-OPS-APPCOMPAT-MANIFEST-001` follow-up subsection for the rename
# rationale; evidence at
# `production/qa/evidence/sprint-16-appcompat-manifest-evidence.md`.
[[test]]
name = "spawn_range_live_refresh_contract"
path = "../tests/unit/protocol/spawn_range_live_update_contract_test.rs"

# S13-PROTO-INVARIANT-001: workspace invariant test ensuring every
# register_c2s::<T> / register_s2c::<T> entry in shared/src/protocol.rs has
# at least one send-site and one drain-site across client/src/ and
# server/src/. Pre-S13-PROTO-ORPHAN-DRAIN-001 the test is #[ignore]-gated
# (orphan list captured in
# production/qa/evidence/sprint-13-proto-invariant-evidence.md); the
# drain-story commit removes the ignore. See tests/invariants/ header.
[[test]]
name = "protocol_completeness_invariant"
path = "../tests/invariants/protocol_completeness_test.rs"
