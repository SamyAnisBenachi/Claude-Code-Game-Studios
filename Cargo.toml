[workspace]
members = ["shared", "server", "client"]
resolver = "2"

# Shared dependency versions — update here, not per-crate
[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
lightyear = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
rand = "0.9"
rand_chacha = "0.3"
# bevy_tweening: no 0.18-compatible release on crates.io as of 2026-04-29 (latest = 0.15).
# Re-check before any animation story. Removed from workspace to unblock cargo check.
# bevy_tweening = "0.18"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "PROPRIETARY"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"   # smaller WASM; acceptable for multiplayer client

[profile.dev]
opt-level = 1     # Bevy is unusable at opt-level=0
