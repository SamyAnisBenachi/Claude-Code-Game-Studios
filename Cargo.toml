[workspace]
members = ["shared", "server", "client", "tools/two-client-runtime"]
resolver = "2"

# Shared dependency versions — update here, not per-crate
[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
lightyear = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
rand = "0.8"
rand_chacha = "0.3"
# bevy_tweening 0.15.0 is the Bevy 0.18-compatible release.
bevy_tweening = { version = "0.15", default-features = false }

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "PROPRIETARY"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"   # smaller WASM; acceptable for multiplayer client

[profile.dev]
opt-level = 1     # Bevy is unusable at opt-level=0
