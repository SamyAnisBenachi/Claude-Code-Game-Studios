# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-04-29"  # updated: objective-system.md authored — 2 new formulas (objective_damage, fake_reward_probability), 1 new network message (ObjectiveDestroyed), 5 referenced_by updates

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: mana_ramp
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/lanes-and-lies-gdd.md
    variables:
      - round_number
      - mana_cap
    output_range: [1, 12]
    expression: "min(R, mana_cap)"
    notes: "Applied at the start of each DRAFT phase. Monotonically non-decreasing until mana_cap is reached."
    added: 2026-04-28
    revised: ""

  - name: interest
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/lanes-and-lies-gdd.md
      - design/gdd/game-config.md
    variables:
      - gold_at_resolution_end
      - interest_threshold_gold
      - interest_max_bonus
    output_range: [0, 2]
    expression: "min(floor(g / interest_threshold_gold), interest_max_bonus)"
    notes: "Snapshot taken from gold held at RESOLUTION end, BEFORE baseline is added. interest_threshold_gold is a GameConfig field (default 5, safe range 5-10); interest_max_bonus is a GameConfig field (default 2)."
    added: 2026-04-28
    revised: "2026-04-29"

  - name: gold_income
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/lanes-and-lies-gdd.md
    variables:
      - gold_at_resolution_end
      - interest_max_bonus
      - gold_baseline_per_round
    output_range: ["gold_prev+2", "gold_prev+4"]
    expression: "gold_prev + min(floor(gold_prev / 5), interest_max_bonus) + gold_baseline_per_round"
    notes: "Applied at DRAFT start. Interest is computed first from gold_prev snapshot, then baseline added."
    added: 2026-04-28
    revised: ""

  - name: is_auction_round
    status: active
    source: design/gdd/round-state-machine.md
    referenced_by:
      - design/gdd/round-state-machine.md
    variables:
      - round_number
    output_range: [false, true]
    expression: "R mod 3 == 0"
    notes: "Evaluated after round_number increments on RESOLUTION exit. DRAFT_INITIAL (round 1) is exempt — formula is never evaluated for round 1. Density: one auction every 3 rounds; 3-4 auctions in a typical 9-12 round game."
    added: 2026-04-28
    revised: ""

  - name: unit_movement
    status: active
    source: design/gdd/board-lane-system.md
    referenced_by:
      - design/gdd/board-lane-system.md
    variables:
      - current_cell
      - mp
      - player_direction
    output_range: [1, 8]
    expression: "clamp(current_cell + direction(player) * mp, 1, 8)"
    notes: "direction(Player A) = +1; direction(Player B) = -1. Applied independently at sub-step 2 (CHARGE X) and sub-step 5 (standard movement). Units clamp at objective cell and persist there."
    added: 2026-04-28
    revised: ""

  - name: spawn_range_valid
    status: active
    source: design/gdd/board-lane-system.md
    referenced_by:
      - design/gdd/board-lane-system.md
      - design/gdd/objective-system.md
    variables:
      - target_cell
      - fakes_destroyed
      - player
      - spawn_cell_A  # = 1, loaded from GameConfig
      - spawn_cell_B  # = 8, loaded from GameConfig
    output_range: [false, true]
    expression: "Player A: (target_cell >= spawn_cell_A) AND (target_cell <= spawn_cell_A + fakes_A); Player B: (target_cell >= spawn_cell_B - fakes_B) AND (target_cell <= spawn_cell_B)"
    notes: "spawn_cell_A=1, spawn_cell_B=8 (named constants from GameConfig, not hardcoded). Spawn range expands globally across all 5 lanes by 1 cell per fake objective destroyed. Structures and Traps bypass this formula entirely."
    added: 2026-04-28
    revised: "2026-04-29"

  - name: objective_damage
    status: active
    source: design/gdd/objective-system.md
    referenced_by:
      - design/gdd/objective-system.md
    variables:
      - HP_current
      - amount
    output_range: [0, 5]
    expression: "HP_new = max(0, HP_current - amount)"
    notes: "Implemented via saturating_sub in Rust. AR is 0 on objectives — no AR reduction step. Short-circuit if amount == 0. Destruction fires only on HP_current > 0 → HP_new == 0 transition."
    added: "2026-04-29"
    revised: ""

  - name: fake_reward_probability
    status: active
    source: design/gdd/objective-system.md
    referenced_by:
      - design/gdd/objective-system.md
    variables:
      - RNG_draw
    output_range: ["ManaCapIncreased", "FreeCardPick"]
    expression: "gen_range(0..2) -> { 0: ManaCapIncreased, 1: FreeCardPick }"
    notes: "Uniform 50/50 Bernoulli per fake destruction. Independent draws. Uses one seed from RESOLUTION RNG chain. ManaCapIncreased -> Economy System; FreeCardPick -> draw_random_card on Card Data & Pool."
    added: "2026-04-29"
    revised: ""

