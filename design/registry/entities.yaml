# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: mana_ramp
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/lanes-and-lies-gdd.md
    variables:
      - round_number
      - mana_cap
    output_range: [1, 12]
    expression: "min(R, mana_cap)"
    notes: "Applied at the start of each DRAFT phase. Monotonically non-decreasing until mana_cap is reached."
    added: 2026-04-28
    revised: ""

  - name: interest
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/lanes-and-lies-gdd.md
      - design/gdd/game-config.md
    variables:
      - gold_at_resolution_end
      - interest_threshold_gold
      - interest_max_bonus
    output_range: [0, 2]
    expression: "min(floor(g / interest_threshold_gold), interest_max_bonus)"
    notes: "Snapshot taken from gold held at RESOLUTION end, BEFORE baseline is added. interest_threshold_gold is a GameConfig field (default 5, safe range 5-10); interest_max_bonus is a GameConfig field (default 2)."
    added: 2026-04-28
    revised: "2026-04-29"

  - name: gold_income
    status: active
    source: design/gdd/economy-system.md
    referenced_by:
      - design/gdd/economy-system.md
      - design/gdd/lanes-and-lies-gdd.md
    variables:
      - gold_at_resolution_end
      - interest_max_bonus
      - gold_baseline_per_round
    output_range: ["gold_prev+2", "gold_prev+4"]
    expression: "gold_prev + min(floor(gold_prev / 5), interest_max_bonus) + gold_baseline_per_round"
    notes: "Applied at DRAFT start. Interest is computed first from gold_prev snapshot, then baseline added."
    added: 2026-04-28
    revised: ""

  - name: is_auction_round
    status: active
    source: design/gdd/round-state-machine.md
    referenced_by:
      - design/gdd/round-state-machine.md
      - design/gdd/auction-system.md
    variables:
      - round_number
    output_range: [false, true]
    expression: "R mod 3 == 0"
    notes: "Evaluated after round_number increments on RESOLUTION exit. DRAFT_INITIAL (round 1) is exempt — formula is never evaluated for round 1. Density: one auction every 3 rounds; 3-4 auctions in a typical 9-12 round game."
    added: 2026-04-28
    revised: ""

  - name: starting_price
    status: active
    source: design/gdd/auction-system.md
    referenced_by:
      - design/gdd/auction-system.md
      - design/gdd/lanes-and-lies-gdd.md
    variables:
      - rarity
    output_range: [3, 5]
    expression: "{ Rare: auction_floor_rare, Epic: auction_floor_epic, Legendary: auction_floor_legendary }[rarity]"
    notes: "Sets current_price at auction start. Values from GameConfig fields (to be added: auction_floor_rare=3, auction_floor_epic=4, auction_floor_legendary=5). First valid bid = starting_price + 1."
    added: "2026-04-29"
    revised: ""

  - name: minimum_bid
    status: active
    source: design/gdd/auction-system.md
    referenced_by:
      - design/gdd/auction-system.md
      - design/gdd/lanes-and-lies-gdd.md
      - design/gdd/shop-auction-ui.md
    variables:
      - current_price
    output_range: [4, "unbounded"]
    expression: "current_price + 1"
    notes: "A C2SPlaceBid with amount < minimum_bid is rejected with AmountTooLow. current_price starts at starting_price and increases with each accepted bid."
    added: "2026-04-29"
    revised: ""

  - name: timer_reset_on_bid
    status: active
    source: design/gdd/auction-system.md
    referenced_by:
      - design/gdd/auction-system.md
      - design/gdd/lanes-and-lies-gdd.md
      - design/gdd/game-config.md
    variables:
      - timer_remaining_ms
      - auction_timer_reset_seconds
      - auction_timer_seconds
    output_range: [5000, 20000]
    expression: "min(timer_remaining_ms + auction_timer_reset_seconds * 1000, auction_timer_seconds * 1000)"
    notes: "Applied on each accepted bid. All wire messages carry milliseconds. Timer can never exceed its initial value (cap = auction_timer_seconds * 1000 = 20000ms default)."
    added: "2026-04-29"
    revised: ""

  - name: unit_movement
    status: active
    source: design/gdd/board-lane-system.md
    referenced_by:
      - design/gdd/board-lane-system.md
    variables:
      - current_cell
      - mp
      - player_direction
    output_range: [1, 8]
    expression: "clamp(current_cell + direction(player) * mp, 1, 8)"
    notes: "direction(Player A) = +1; direction(Player B) = -1. Applied independently at sub-step 2 (CHARGE X) and sub-step 5 (standard movement). Units clamp at objective cell and persist there."
    added: 2026-04-28
    revised: ""

  - name: spawn_range_valid
    status: active
    source: design/gdd/board-lane-system.md
    referenced_by:
      - design/gdd/board-lane-system.md
      - design/gdd/objective-system.md
    variables:
      - target_cell
      - fakes_destroyed
      - player
      - spawn_cell_A  # = 1, loaded from GameConfig
      - spawn_cell_B  # = 8, loaded from GameConfig
    output_range: [false, true]
    expression: "Player A: (target_cell >= spawn_cell_A) AND (target_cell <= spawn_cell_A + fakes_A); Player B: (target_cell >= spawn_cell_B - fakes_B) AND (target_cell <= spawn_cell_B)"
    notes: "spawn_cell_A=1, spawn_cell_B=8 (named constants from GameConfig, not hardcoded). Spawn range expands globally across all 5 lanes by 1 cell per fake objective destroyed. Structures and Traps bypass this formula entirely."
    added: 2026-04-28
    revised: "2026-04-29"

  - name: objective_damage
    status: active
    source: design/gdd/objective-system.md
    referenced_by:
      - design/gdd/objective-system.md
    variables:
      - HP_current
      - amount
    output_range: [0, 5]
    expression: "HP_new = max(0, HP_current - amount)"
    notes: "Implemented via saturating_sub in Rust. AR is 0 on objectives — no AR reduction step. Short-circuit if amount == 0. Destruction fires only on HP_current > 0 → HP_new == 0 transition."
    added: "2026-04-29"
    revised: ""

  - name: fake_reward_probability
    status: active
    source: design/gdd/objective-system.md
    referenced_by:
      - design/gdd/objective-system.md
    variables:
      - RNG_draw
    output_range: ["ManaCapIncreased", "FreeCardPick"]
    expression: "gen_range(0..2) -> { 0: ManaCapIncreased, 1: FreeCardPick }"
    notes: "Uniform 50/50 Bernoulli per fake destruction. Independent draws. Uses one seed from RESOLUTION RNG chain. ManaCapIncreased -> Economy System; FreeCardPick -> draw_random_card on Card Data & Pool."
    added: "2026-04-29"
    revised: ""

  - name: net_damage
    status: active
    source: design/gdd/combat-resolution.md
    referenced_by:
      - design/gdd/combat-resolution.md
    variables:
      - ATK_base
      - ATK_leader
      - ATK_type
      - ATK_vuln
      - ATK_resist
      - AR_base
      - AR_pierce
      - AR_attacker_combat  # +1 when type_beats(attacker, defender)=true; applied to attacker's AR in the simultaneous return-strike (two-pass bilateral combat model)
    output_range: [0, 31]  # max: ATK_base=20 + ATK_leader=5 + ATK_type=1 + ATK_vuln=5, AR=0. Typical play: 0-8.
    expression: "max(0, max(0, ATK_base + ATK_leader + ATK_type + ATK_vuln - ATK_resist) - (if AR_pierce { 0 } else { AR_base }))"
    notes: "Full modifier stack in combat-resolution.md Detailed Design. Intermediate arithmetic in i32 (not u8) to prevent Rust underflow panic. AR_attacker_combat used in two-pass simultaneous bilateral combat — see combat-resolution.md Formula 1 for the algorithm. SILENCE strips attacker keywords before stack evaluates. STUN prevents attack (damage=0)."
    added: "2026-04-29"
    revised: "2026-04-29"  # was: AR_attacker_combat variable missing; output_range was 'uncapped'

  - name: type_advantage
    status: active
    source: design/gdd/combat-resolution.md
    referenced_by:
      - design/gdd/combat-resolution.md
    variables:
      - attacker_type
      - defender_type
    output_range: [false, true]
    expression: "type_beats(attacker, defender): Blade>Arcane>Shield>Blade (cyclic); Neutral beats/loses to nothing; same type = false"
    notes: "When true: attacker gains +1 ATK_combat and +1 AR_combat (retaliation only) for that combat interaction only. Does not modify base card stats. Most cards currently Neutral (unassigned). Cyclic RPS triangle."
    added: "2026-04-29"
    revised: ""

  - name: refresh_cost
    status: active
    source: design/gdd/card-acquisition.md
    referenced_by:
      - design/gdd/card-acquisition.md
      - design/gdd/economy-system.md
      - design/gdd/shop-auction-ui.md
    variables:
      - refresh_base_cost
      - refresh_cap
      - refresh_count_this_draft
    output_range: [1, "refresh_base_cost + refresh_cap"]
    expression: "refresh_base_cost + min(refresh_count_this_draft, refresh_cap)"
    notes: "Applied on each manual refresh during DRAFT_SHOP. refresh_count_this_draft resets to 0 on every DRAFT_SHOP phase entry. Default output: 1g first refresh, 2g all subsequent (base=1, cap=1). Economy System validates spend before draw fires."
    added: "2026-04-29"
    revised: ""

  - name: repel_destination
    status: active
    source: design/gdd/keyword-system.md
    referenced_by:
      - design/gdd/keyword-system.md
    variables:
      - target_cell
      - advance_dir
      - X
    output_range: [1, 8]
    expression: "clamp(target_cell + (−advance_dir(target.owner)) × X, 1, 8)"
    notes: "advance_dir(Player A)=+1, advance_dir(Player B)=-1. Output always [1,8] — clamped at board edges, never off-board. IRREMOVABLE units: no displacement. WALL can be pushed."
    added: "2026-04-30"
    revised: ""

  - name: attract_destination
    status: active
    source: design/gdd/keyword-system.md
    referenced_by:
      - design/gdd/keyword-system.md
    variables:
      - caster_cell
      - target_cell
      - X
    output_range: [1, 8]
    expression: "effective_X = min(X, |caster_cell − target_cell|); attract_destination = target_cell + sign(caster_cell − target_cell) × effective_X"
    notes: "Target stops at caster's cell — cannot overshoot. effective_X = 0 if already co-located. Lane-local only. IRREMOVABLE blocks."
    added: "2026-04-30"
    revised: ""

  - name: outnumbered
    status: active
    source: design/gdd/keyword-system.md
    referenced_by:
      - design/gdd/keyword-system.md
      - design/gdd/combat-resolution.md
    variables:
      - alive_units_player
      - alive_units_opponent
    output_range: [false, true]
    expression: "count(alive_units(player)) < count(alive_units(opponent))"
    notes: "Strict less-than only. Equal counts = false. Counts: all alive Minions + Structures across all lanes; Traps excluded. Evaluated at start of each sub-step — can flip mid-RESOLUTION."
    added: "2026-04-30"
    revised: ""

  - name: local_free_gold
    status: active
    source: design/gdd/shop-auction-ui.md
    referenced_by:
      - design/gdd/shop-auction-ui.md
      - design/gdd/hud.md
    variables:
      - gold
      - reserved_gold
    output_range: [0, "gold"]
    expression: "gold - reserved_gold"
    notes: "gold and reserved_gold both sourced from S2CGoldBroadcast (not S2CGoldUpdate — reserved_gold is not a field of S2CGoldUpdate). Computed for both the local player and the opponent during DRAFT_AUCTION for the auction panel free-gold display. guaranteed non-negative by server invariant (reserved_gold <= gold); implementation should use saturating subtraction as a guard. Will also be referenced by HUD GDD for opponent free-gold display."
    added: "2026-04-29"
    revised: ""

  - name: gelure_transfer
    status: active
    source: design/gdd/class-system.md
    referenced_by:
      - design/gdd/class-system.md
      - design/gdd/economy-system.md
    variables:
      - current_mana
      - reserve
    output_range: [0, "mana_cap"]
    expression: "reserve_new = reserve + current_mana; current_mana_new = 0"
    notes: "Xelor-only. Consumes current_mana to add to reserve. Effect owner: Economy System. 0-cost cast."
    added: "2026-04-30"
    revised: ""

  - name: xelorium_steal
    status: active
    source: design/gdd/class-system.md
    referenced_by:
      - design/gdd/class-system.md
      - design/gdd/economy-system.md
    variables:
      - self_reserve
      - opponent_current_mana
    output_range: [0, "mana_cap"]
    expression: "self.reserve_new = self.reserve + opponent.current_mana; opponent.current_mana_new = 0"
    notes: "Xelor-only. Opponent reserve untouched. Resolves at sub-step 1. If opponent.current_mana=0, steal=0 but cost (4 mana) still paid."
    added: "2026-04-30"
    revised: ""

  - name: rollback_charge
    status: active
    source: design/gdd/class-system.md
    referenced_by:
      - design/gdd/class-system.md
      - design/gdd/economy-system.md
      - design/gdd/combat-resolution.md
    variables:
      - reserve
      - unit_cells
    output_range: [1, 8]
    expression: "n = reserve; reserve_new = 0; for each unit: destination = clamp(cell + direction * n, 1, 8)"
    notes: "Xelor-only. Fires sub-step 2. STUNned units excluded. HASTE units eligible. n=0 legal (no movement, cost paid)."
    added: "2026-04-30"
    revised: ""

  - name: garde_temps_gate
    status: active
    source: design/gdd/class-system.md
    referenced_by:
      - design/gdd/class-system.md
      - design/gdd/economy-system.md
      - design/gdd/objective-system.md
    variables:
      - reserve
      - garde_temps_reserve_cost
      - garde_temps_used_this_game
      - garde_temps_per_game_cap
    output_range: [false, true]
    expression: "playable = (reserve >= garde_temps_reserve_cost) AND target_valid AND (garde_temps_used_this_game < garde_temps_per_game_cap); if playable: reserve -= garde_temps_reserve_cost; garde_temps_used_this_game += 1"
    notes: "Xelor-only. Costs 20 reserve (not current_mana). Three-part gate: reserve >= cost AND target alive AND per-game cap not reached. On success, chosen enemy objective HP → 0. garde_temps_per_game_cap default 1. Counter owned by Game Session System."
    added: "2026-04-30"
