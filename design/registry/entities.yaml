# ─── NETWORK MESSAGES ────────────────────────────────────────────────────────
# Named server-to-client (S2C) or client-to-server (C2S) message types that
# cross system boundaries. Register when a message type is referenced in more
# than one GDD. Full message definitions live in the owning GDD.

network_messages:
  - name: S2CGameOver
    status: active
    source: design/gdd/round-state-machine.md
    referenced_by:
      - design/gdd/round-state-machine.md
      - design/gdd/lanes-and-lies-gdd.md
      - design/gdd/network-protocol.md
    payload: "{ loser: Option<PlayerId>, round: u32, reason: GameOverReason }"
    channel: reliable
    notes: "Broadcast in addition to S2CPhaseChanged(GAME_OVER). loser is None for Draw outcomes (mutual destruction, mutual disconnection, resolution timeout) and Some(id) for single-loser outcomes (Disconnection, ObjectivesDestroyed). GameOverReason enum has four variants: ObjectivesDestroyed, Disconnection, Draw, ResolutionTimeout. See round-state-machine.md Rule 14 for full definition."
    added: "2026-04-29"
    revised: ""

  - name: S2CPhaseChanged
    status: active
    source: design/gdd/round-state-machine.md
    referenced_by:
      - design/gdd/round-state-machine.md
      - design/gdd/network-protocol.md
      - design/gdd/hud.md
    payload: "{ phase: RoundPhase, round_number: u32, timer_duration_ms: u32 }"
    channel: reliable
    notes: "Broadcast on every RSM phase transition, after all server-side entry actions have fired. Payload defined in network-protocol.md. timer_duration_ms=0 for RESOLUTION and GAME_OVER."
    added: "2026-04-29"
    revised: ""

  - name: S2CGameSnapshot
    status: active
    source: design/gdd/network-protocol.md
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/round-state-machine.md
      - design/gdd/hud.md
    payload: "{ protocol_version, round_number, phase, timer_remaining_ms, players: Vec<PlayerSnapshot>, board: BoardSnapshot, auction_state: Option<AuctionSnapshot> }"
    channel: reliable
    notes: "Unicast per player on every connect and reconnect. Opponent secret fields stripped. Full schema in network-protocol.md Section D.1. Resolves RSM Open Question 4 (late-joiner sync)."
    added: "2026-04-29"
    revised: ""

  - name: S2CGoldUpdate
    status: active
    source: design/gdd/network-protocol.md
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/economy-system.md
      - design/gdd/hud.md
    payload: "{ gold: u32, current_mana: u32, reserve_mana: u32, mana_cap: u8 }"
    channel: reliable
    notes: "Unicast to owning player only. Sent on gold/mana change events: purchase, draft entry, mana cap increase, baseline/interest income, auction spend. EXCEPTION: kill rewards and objective rewards during RESOLUTION are NOT sent via S2CGoldUpdate — they are embedded as GoldAwarded entries in S2CResolutionEvent. S2CGoldUpdate resumes for all non-RESOLUTION gold events. Never broadcast."
    added: "2026-04-29"
    revised: "2026-04-29"  # was: notes said 'kill reward, objective reward' without RESOLUTION exception

  - name: S2CPlacementReveal
    status: active
    source: design/gdd/network-protocol.md
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/board-lane-system.md
    payload: "{ placements: Vec<PlacedCard> }"
    channel: reliable
    notes: "Broadcast atomically at RESOLUTION sub-step 1 (PlacementBuffer commit). Contains both players' placements in one message — not per-entity replication — to guarantee simultaneous client-side reveal. PlacedCard matches the C2SSubmitPlacement payload struct."
    added: "2026-04-29"
    revised: ""

  - name: S2CResolutionEvent
    status: active
    source: design/gdd/network-protocol.md
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/board-lane-system.md
    payload: "{ events: Vec<TaggedEvent { sub_step: u8, event: ResolutionEvent }> }"
    channel: reliable
    notes: "Broadcast once per RESOLUTION, after S2CPlacementReveal and before S2CPhaseChanged(DRAFT_SHOP). ResolutionEvent enum variants in network-protocol.md Section D.2. Client replays in order for animation."
    added: "2026-04-29"
    revised: ""

  - name: C2SSubmitPlacement
    status: active
    source: design/gdd/network-protocol.md
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/board-lane-system.md
      - design/gdd/round-state-machine.md
    payload: "{ placements: Vec<PlacedCard { card_id, target: PlayTarget, reserve_amount: u32 }> }"
    channel: reliable
    notes: "Single batch submit per PLACEMENT phase. Marks player as submitted in RSM. Empty list = zero new cards. Cannot be retracted once accepted. See PlayTarget enum in network-protocol.md Section C."
    added: "2026-04-29"
    revised: ""

  - name: GameOverReason
    status: active
    source: design/gdd/round-state-machine.md
    referenced_by:
      - design/gdd/round-state-machine.md
      - design/gdd/network-protocol.md
      - design/gdd/keyword-system.md
    payload: "enum { ObjectivesDestroyed, Disconnection, Draw, ResolutionTimeout }"
    notes: "Payload field of S2CGameOver. ObjectivesDestroyed = normal win condition; Disconnection = player exceeded disconnect_grace_seconds; Draw = mutual destruction or mutual disconnection same tick; ResolutionTimeout = RESOLUTION 60s safety timeout (distinct from Draw — client shows different result screen). Added ResolutionTimeout 2026-04-30 (R8 C-R8-1 fix, closes C-B2)."
    added: "2026-04-29"
    revised: "2026-04-30"

  - name: ObjectiveDestroyed
    status: active
    source: design/gdd/objective-system.md
    referenced_by:
      - design/gdd/objective-system.md
      - design/gdd/network-protocol.md
      - design/gdd/hud.md
    payload: "{ target_player_id: PlayerId, lane: LaneId, was_fake: bool }"
    channel: reliable
    notes: "Broadcast to both players at RESOLUTION-end sync when an objective's HP reaches 0. target_player_id identifies whose objective was destroyed (required when multiple objectives fall same RESOLUTION). Reveals real/fake identity to attacker. Triggers Board Rendering to clear the correct slot. Not a mid-sub-step push — batched at RESOLUTION end."
    added: "2026-04-29"
    revised: ""

  - name: S2CAuctionCard
    status: active
    source: design/gdd/auction-system.md
    referenced_by:
      - design/gdd/auction-system.md
      - design/gdd/network-protocol.md
    payload: "{ card_id: CardId, starting_price: u32 }"
    channel: reliable
    notes: "Broadcast by Auction System on SELECTING exit. MUST be enqueued before S2CPhaseChanged(DRAFT_AUCTION) — ordering invariant. Not re-sent on reconnect; AuctionSnapshot in S2CGameSnapshot serves reconnecting clients."
    added: "2026-04-29"
    revised: ""

  - name: S2CAuctionBidAccepted
    status: active
    source: design/gdd/auction-system.md
    referenced_by:
      - design/gdd/auction-system.md
      - design/gdd/network-protocol.md
    payload: "{ bidder: PlayerId, amount: u32, new_timer_ms: u32 }"
    channel: reliable
    notes: "Broadcast to all players on each accepted bid. Client updates price display, leader display, and timer bar from this payload. Timer bar must use new_timer_ms, not local timer drift."
    added: "2026-04-29"
    revised: ""

  - name: S2CAuctionSettled
    status: active
    source: design/gdd/auction-system.md
    referenced_by:
      - design/gdd/auction-system.md
      - design/gdd/network-protocol.md
    payload: "{ winner: Option<PlayerId>, amount: u32 }"
    channel: reliable
    notes: "Terminal auction signal. Broadcast when timer reaches 0. winner=None if no bids placed. Gold is deducted server-side before this message is sent — clients update gold display on receipt. NOT sent on AbortAuction (RSM already handling GAME_OVER in that case)."
    added: "2026-04-29"
    revised: ""

  - name: S2CAuctionBidRejected
    status: active
    source: design/gdd/auction-system.md
    referenced_by:
      - design/gdd/auction-system.md
      - design/gdd/network-protocol.md
    payload: "{ reason: BidRejectedReason }"
    channel: reliable
    notes: "Unicast to bidder only on bid validation failure. BidRejectedReason enum (5 variants): InsufficientGold, AmountTooLow, AuctionExpired, AlreadyLeader, HandFull. AlreadyLeader and HandFull are additions not yet in network-protocol.md — must be added (OQ3)."
    added: "2026-04-29"
    revised: ""

  - name: S2CActivationRejected
    status: active
    source: design/gdd/network-protocol.md
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/class-system.md
    payload: "{ entity_id: EntityId, reason: ActivationRejectedReason }"
    channel: reliable
    scope: "unicast (activating player)"
    notes: "Sent when C2SActivateCard is rejected: WrongPhase, EntityNotFound, NotInHand, InsufficientMana, InsufficientReserve, InvalidTarget, ActivationLimitReached. Used by clients to roll back optimistic activation UI; successful activation remains confirmed by S2CGoldUpdate."
    added: "2026-05-01"
    revised: ""

  - name: S2CDraftOffering
    status: active
    source: design/gdd/card-acquisition.md
    referenced_by:
      - design/gdd/card-acquisition.md
      - design/gdd/card-data-pool.md
    payload: "{ card_ids: [CardId; 9] }"
    channel: reliable
    notes: "Unicast to the player once at DRAFT_INITIAL entry, after draw_initial_draft() completes. Contains exactly 9 distinct card IDs (any rarity). Full schema to be formally registered in network-protocol.md (OQ2 in card-acquisition.md)."
    added: "2026-04-29"
    revised: ""

  - name: S2CShopSlots
    status: active
    source: design/gdd/card-acquisition.md
    referenced_by:
      - design/gdd/card-acquisition.md
      - design/gdd/card-data-pool.md
    payload: "{ slots: Vec<Option<CardId>> }"
    channel: reliable
    notes: "Unicast to the player after every auto-refresh (DRAFT_SHOP and DRAFT_AUCTION entry) and manual refresh. Contains 3 slot entries; null slots are empty (pool exhausted or dedup short-circuit). Full schema to be formally registered in network-protocol.md (OQ2 in card-acquisition.md)."
    added: "2026-04-29"
    revised: ""

  - name: S2CGoldBroadcast
    status: active
    source: design/gdd/network-protocol.md
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/economy-system.md
      - design/gdd/auction-system.md
      - design/gdd/shop-auction-ui.md
      - design/gdd/hud.md
    payload: "{ player_id: PlayerId, gold: u32, reserved_gold: u32 }"
    channel: reliable
    notes: "Broadcast to all players on any gold mutation. reserved_gold = amount locked by the player's current auction bid (0 outside DRAFT_AUCTION by invariant). free_gold = gold - reserved_gold. Used by auction panel to display both players' available gold. See formula local_free_gold in shop-auction-ui.md."
    added: "2026-04-30"
    revised: ""

  - name: S2CObjectiveIdentities
    status: active
    source: docs/architecture/adr-001-objective-identity-unicast.md  # ADR is authoritative; NP GDD wraps for delivery
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/board-rendering.md
      - design/gdd/hud.md
      - docs/architecture/adr-003-cargo-workspace-structure.md
    payload: "{ identities: Vec<(LaneId, bool)> }"
    channel: reliable
    scope: "unicast (owner)"
    notes: "Per-client objective identity reveal. Sent once at DRAFT_INITIAL to each player with their own (lane, is_fake) tuples. MUST be re-sent on reconnect after S2CGameSnapshot — reliable delivery guarantees in-session but not reconnect replay. Payload ~6 bytes/player. Source-of-truth: ADR-001. Board Rendering caches in ObjectiveIdentityCache resource; Rule 12 forbids reading it for standing-objective rendering; only used for Sang Méprise audio-suppression branch."
    added: "2026-04-30"
    revised: ""

  - name: S2CCardAcquired
    status: active
    source: design/gdd/network-protocol.md
    referenced_by:
      - design/gdd/network-protocol.md
      - design/gdd/prism-system.md
      - design/gdd/card-acquisition.md
      - design/gdd/objective-system.md
      - design/gdd/auction-system.md
    payload: "{ card_id: CardId, source: AcquisitionSource }"
    channel: reliable
    notes: "Unicast to owning player on each card added to hand from outside the shop purchase flow. AcquisitionSource enum — complete variant set defined in network-protocol.md:569-580: ShopPurchase, DraftInitial, AuctionWon, FreeCardPick, PrismLane1, PrismLane2, PrismLane3, PrismLane4, PrismLane5, KeywordEffect. prism-system.md OQ2 still requires formal S2CCardAcquired schema registration in NP."
    added: "2026-04-30"
    revised: "2026-04-30"

  - name: S2CSangMepriseReveal
    status: active
    source: design/gdd/class-system.md
    referenced_by:
      - design/gdd/class-system.md
      - design/gdd/objective-system.md
      - design/gdd/hud.md
    payload: "{ revealed_objectives: Vec<(PlayerId, LaneId, bool)> }"
    channel: reliable
    scope: "broadcast (both players)"
    notes: "Sacrier-only. Sent at sub-step 1 when Sang Méprise resolves. Reveals all alive objectives (both players) to both players for the current RESOLUTION only. Distinct from S2CObjectiveIdentities (permanent per-player secret). Reconnect gap: S2CGameSnapshot missing active_sang_meprise_reveals field — lock field name before Architecture (OQ-CS-2, NP OQ6). Registered 2026-04-30 (R8 C-B6 fix)."
    added: "2026-04-30"
    revised: ""

  - name: S2CSingleObjectiveReveal
    status: active
    source: design/gdd/class-system.md
    referenced_by:
      - design/gdd/class-system.md
      - design/gdd/objective-system.md
    payload: "{ player_id: PlayerId, lane: LaneId, is_fake: bool }"
    channel: reliable
    scope: "unicast (opponent only)"
    notes: "Ecaflip Krosmic (Dé du Chateux) only. Unicast to the Ecaflip player's opponent. Reveals a single objective — distinct from S2CSangMepriseReveal (full-board, both players). Triggered when die roll <= dé_chateux_reveal_threshold. Must be registered in network-protocol.md D.1 before Ecaflip story implementation (class-system.md NP-4). Registered 2026-04-30 (R8 C-NEW-1 fix)."
    added: "2026-04-30"
    revised: ""

