    channel: reliable
    scope: "unicast (owner)"
    notes: "Per-client objective identity reveal. Sent once at DRAFT_INITIAL to each player with their own (lane, is_fake) tuples. MUST be re-sent on reconnect after S2CGameSnapshot — reliable delivery guarantees in-session but not reconnect replay. Payload ~6 bytes/player. Source-of-truth: ADR-001. Board Rendering caches in ObjectiveIdentityCache resource; Rule 12 forbids reading it for standing-objective rendering; only used for Sang Méprise audio-suppression branch."
    added: "2026-04-30"
    revised: ""

